name: Daily 8:00 PM TrainingPeaks Dashboard Auto Update

on:
  schedule:
    # 12:00 UTC = 20:00 (8:00 PM) Taiwan Time (UTC+8)
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Daily Update Chain
        run: |
          python scripts/daily_update.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "[AUTO] Daily 8:00 PM Dashboard Update" && git push)
