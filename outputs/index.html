<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrainingPeaks 52 週運動自動化全景儀表板 (網頁版內容閱覽)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0F172A;
            --bg-sidebar: #1E293B;
            --bg-card: #1E293B;
            --bg-card-hover: #334155;
            --accent-cyan: #06B6D4;
            --accent-blue: #3B82F6;
            --accent-green: #10B981;
            --accent-orange: #F59E0B;
            --accent-red: #EF4444;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --border-color: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        /* NAVIGATION TOGGLE & OVERLAY */
        .sidebar-header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .btn-toggle-desktop, .btn-toggle-mobile {
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.2), rgba(59, 130, 246, 0.2));
            border: 1px solid rgba(56, 189, 248, 0.4);
            color: #38BDF8;
            padding: 7px 12px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .btn-toggle-desktop:hover, .btn-toggle-mobile:hover {
            background: var(--accent-cyan);
            color: #0F172A;
            border-color: transparent;
        }
        .btn-close-sidebar {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.78rem;
            cursor: pointer;
        }
        .btn-close-sidebar:hover { color: #FFF; border-color: var(--accent-red); background: rgba(239, 68, 68, 0.2); }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(4px);
            z-index: 9998;
        }

        /* MOBILE RESPONSIVE LAYOUT (< 769px) */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
                height: auto;
                overflow-y: auto;
            }
            .sidebar {
                display: none;
                position: fixed;
                top: 0; left: 0;
                width: 290px;
                height: 100vh;
                z-index: 9999;
                box-shadow: 10px 0 30px rgba(0,0,0,0.8);
            }
            .sidebar.mobile-open {
                display: flex;
            }
            .sidebar-overlay.mobile-open {
                display: block;
            }
            .main-content {
                width: 100%;
                min-width: 0;
                padding: 16px 12px;
                overflow-x: hidden;
            }
            .main-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
            .subnav-tabs {
                flex-wrap: wrap;
                gap: 6px;
            }
            .subtab-btn {
                flex: 1 1 45%;
                font-size: 0.82rem;
                padding: 8px 6px;
            }
            .grid-kpi, .target-grid, .articles-grid {
                grid-template-columns: 1fr !important;
            }
            .table-custom {
                display: block;
                overflow-x: auto;
                white-space: nowrap;
                width: 100%;
            }
            .btn-toggle-desktop { display: none !important; }
        }

        /* DESKTOP COLLAPSED SIDEBAR (> 768px) */
        @media (min-width: 769px) {
            .btn-toggle-mobile { display: none !important; }
            .sidebar.desktop-collapsed {
                display: none;
            }
        }

        /* SIDEBAR */
        .sidebar {
            width: 330px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            background: linear-gradient(135deg, #1E293B, #0F172A);
        }
        .sidebar-header h1 {
            font-size: 1.2rem;
            font-weight: 800;
            background: linear-gradient(90deg, #38BDF8, #818CF8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .sidebar-header .sub { font-size: 0.78rem; color: var(--text-muted); margin-top: 4px; }
        .sidebar-controls { padding: 10px 16px; border-bottom: 1px solid var(--border-color); }
        .btn-current {
            width: 100%;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
            color: #FFF;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
        }
        .week-list { flex: 1; overflow-y: auto; padding: 10px; }
        .week-item {
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 6px;
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .week-item:hover { background: var(--bg-card-hover); }
        .week-item.active {
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.2), rgba(59, 130, 246, 0.2));
            border-color: var(--accent-cyan);
        }
        .week-title { font-weight: 700; font-size: 0.9rem; }
        .week-dates { font-size: 0.75rem; color: var(--text-muted); }
        .badge-status { font-size: 0.72rem; padding: 2px 7px; border-radius: 10px; font-weight: 600; }
        .badge-past { background: rgba(16, 185, 129, 0.15); color: var(--accent-green); border: 1px solid rgba(16, 185, 129, 0.3); }
        .badge-current { background: rgba(6, 182, 212, 0.25); color: #38BDF8; border: 1px solid #38BDF8; }
        .badge-future { background: rgba(148, 163, 184, 0.15); color: var(--text-muted); border: 1px solid rgba(148, 163, 184, 0.3); }

        /* MAIN CONTENT */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 24px 32px;
        }
        .main-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border-color);
        }
        .subnav-tabs {
            display: flex;
            width: 100%;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }
        .subtab-btn {
            flex: 1;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.9rem;
            text-align: center;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .subtab-btn:hover, .subtab-btn.active {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
            color: #FFF;
            border-color: transparent;
        }
        .subtab-view { display: none; }
        .subtab-view.active { display: block; animation: fadeIn 0.25s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .grid-kpi {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 14px;
            margin-bottom: 20px;
        }
        .kpi-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px 18px;
        }
        .kpi-title { font-size: 0.78rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
        .kpi-val { font-size: 1.5rem; font-weight: 800; margin-top: 4px; }

        .section-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 22px;
            margin-bottom: 20px;
        }
        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #38BDF8;
            margin-bottom: 14px;
        }
        .table-custom {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.92rem;
            margin-top: 8px;
        }
        .table-custom th, .table-custom td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }
        .table-custom th {
            background: rgba(51, 65, 85, 0.5);
            color: #94A3B8;
            font-weight: 600;
        }
        .target-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-top: 10px;
        }
        .target-card { border-radius: 10px; padding: 12px; border: 1px solid var(--border-color); }
        .target-opt { background: rgba(16, 185, 129, 0.1); border-color: rgba(16, 185, 129, 0.4); }
        .target-neu { background: rgba(245, 158, 11, 0.1); border-color: rgba(245, 158, 11, 0.4); }
        .target-con { background: rgba(239, 68, 68, 0.1); border-color: rgba(239, 68, 68, 0.4); }
        .target-tag { font-weight: 700; font-size: 0.82rem; margin-bottom: 4px; }
        .target-opt .target-tag { color: var(--accent-green); }
        .target-neu .target-tag { color: var(--accent-orange); }
        .target-con .target-tag { color: var(--accent-red); }
        .target-time { font-size: 1.25rem; font-weight: 800; }
        .downloads { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
        .btn-dl {
            background: rgba(51, 65, 85, 0.6);
            border: 1px solid var(--border-color);
            color: #38BDF8;
            padding: 8px 12px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.82rem;
            font-weight: 600;
        }
        .btn-dl:hover { background: var(--accent-blue); color: #FFF; }

        /* ARTICLES CATEGORIZED CARDS & NAV CHIPS */
        .nav-quick-bar {
            position: sticky;
            top: 0;
            z-index: 90;
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 12px;
            padding: 10px 16px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            overflow-x: auto;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        }
        .nav-label { font-size: 0.85rem; font-weight: 700; color: #38BDF8; white-space: nowrap; }
        .nav-chip {
            padding: 6px 14px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.82rem;
            font-weight: 700;
            white-space: nowrap;
            transition: all 0.2s ease;
        }
        .chip-summary { background: rgba(245, 158, 11, 0.15); color: #FBBF24; border: 1px solid rgba(245, 158, 11, 0.4); }
        .chip-swim { background: rgba(6, 182, 212, 0.15); color: #22D3EE; border: 1px solid rgba(6, 182, 212, 0.4); }
        .chip-bike { background: rgba(59, 130, 246, 0.15); color: #60A5FA; border: 1px solid rgba(59, 130, 246, 0.4); }
        .chip-run { background: rgba(245, 158, 11, 0.15); color: #FBBF24; border: 1px solid rgba(245, 158, 11, 0.4); }
        .chip-recovery { background: rgba(16, 185, 129, 0.15); color: #34D399; border: 1px solid rgba(16, 185, 129, 0.4); }
        .chip-home { background: rgba(56, 189, 248, 0.15); color: #38BDF8; border: 1px solid rgba(56, 189, 248, 0.4); }
        .nav-chip:hover { transform: translateY(-2px); filter: brightness(1.2); }

        .summary-box {
            background: linear-gradient(135deg, rgba(30,41,59,0.8), rgba(15,23,42,0.9));
            border: 1px solid rgba(245,158,11,0.4);
            border-radius: 14px;
            padding: 22px;
            margin-bottom: 28px;
            box-shadow: 0 4px 16px rgba(245,158,11,0.1);
        }
        .summary-box h2 { color: #FBBF24; font-size: 1.2rem; margin-bottom: 14px; }
        .cat-group { margin-bottom: 32px; }
        .cat-header {
            font-size: 1.25rem;
            color: #38BDF8;
            margin-bottom: 14px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border-color);
            scroll-margin-top: 70px;
        }
        .articles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 18px;
        }
        .art-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.2s ease;
        }
        .art-card:hover {
            border-color: var(--accent-cyan);
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        .art-title { font-size: 1.05rem; font-weight: 700; color: #F8FAFC; margin-bottom: 8px; line-height: 1.4; }
        .art-title a { color: #38BDF8; text-decoration: none; }
        .art-title a:hover { color: var(--accent-cyan); text-decoration: underline; }
        .art-meta { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 10px; line-height: 1.5; }
        .art-desc {
            font-size: 0.88rem;
            color: #CBD5E1;
            background: rgba(15, 23, 42, 0.5);
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 14px;
            flex: 1;
            line-height: 1.6;
        }
        .art-footer { display: flex; justify-content: flex-end; }
        .art-btn {
            background: rgba(6, 182, 212, 0.15);
            border: 1px solid rgba(6, 182, 212, 0.4);
            color: var(--accent-cyan);
            padding: 8px 14px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.84rem;
            font-weight: 700;
            transition: all 0.2s ease;
        }
        .art-btn:hover { background: var(--accent-cyan); color: #0F172A; }
        .ext-link { color: #38BDF8; text-decoration: none; }
        .ext-link:hover { text-decoration: underline; }
        .ext-icon { font-size: 0.8em; color: var(--accent-cyan); }
    </style>
</head>

/news/alanis-siffert-challenge-roth-2026-interview/\" target=\"_blank\" class=\"ext-link\">艾拉妮斯·西弗特 (Alanis Siffert) 如何相信自己的直覺，忽視數據，並克服了羅斯的挑戰 <span class=\"ext-icon\">↗</span></a></div>\n                    <div class=\"art-meta\"><br>**英文原名**: *How Alanis Siffert Trusted Her Gut, Ignored the Data, and Conquered Challenge Roth*<br>**來源**: Triathlete Magazine | **日期**: 2026-07-08</div>\n                    <div class=\"art-desc\">\n                        <div style=\"font-weight: 700; color: var(--accent-cyan); font-size: 0.82rem; margin-bottom: 6px;\">💡 【100字繁體中文重點摘要】</div>\n                        艾拉妮絲·西弗特 (Alanis Siffert) 在挑戰羅斯 (Challenge Roth) 比賽中發現自己的力量值“太高”，並決定…停止尋找。結果呢？擊敗露西·查爾斯·巴克萊，並以 8 小時 09 分 09 秒的成績完成職業生涯的勝利。這位瑞士明星...\n                    </div>\n                    <div class=\"art-footer\">\n                        <a href=\"https://www.triathlete.com/culture/news/alanis-siffert-challenge-roth-2026-interview/\" target=\"_blank\" class=\"art-btn\">🔗 閱讀外網原始文章 ↗</a>\n                    </div>\n                </div>\n            </div>\n        </div>\n    ", "str_html": "<h1 style=\"color:#F8FAFC; margin-top:28px; margin-bottom:14px; font-size:1.5rem;\">🏋️ 2026-W29 第 29 週肌力訓練課表詳細內容</h1>\n<h3 style=\"color:#38BDF8; margin-top:20px; margin-bottom:8px;\">📌 本週肌力訓練安排</h3>\n<li style=\"margin-left:20px; margin-bottom:6px; color:var(--text-main);\"><strong>週一 & 週四（主課 A）：</strong> 專注下肢多關節推拉與髖關節主導動作（30–40 分鐘），保留 2–3 下餘裕。</li>\n<li style=\"margin-left:20px; margin-bottom:6px; color:var(--text-main);\"><strong>週三（短課模板）：</strong> 游泳後或晚間進行核心抗旋轉、抗側彎與足踝推蹬剛性訓練（15–20 分鐘）。</li>\n<li style=\"margin-left:20px; margin-bottom:6px; color:var(--text-main);\"><strong>週日（恢復與拉伸）：</strong> 全身滾筒放鬆與胸椎/髖關節活動度拉伸。</li>\n<hr style=\"border:none; border-top:1px solid var(--border-color); margin:20px 0;\">\n<h3 style=\"color:#38BDF8; margin-top:20px; margin-bottom:8px;\">🏋️ 主課 A（週一與週四執行，約 30–40 分鐘）</h3>\n<table class=\"table-custom\">\n<thead><tr><th>動作名稱</th><th>訓練目標與建議量</th><th>🎥 動作教學影片</  solid rgba(56,189,248,0.3); display:inline-block; font-size:0.85rem;\">▶️ 觀看教學 ↗ ↗</a></td></tr>\n<tr><td><strong>彈力帶側走 (Band Walk)</strong></td><td>2 組 × 10–15 步／邊 (臀中肌激活)</td><td><a href=\"https://www.youtube.com/results?search_query=彈力帶側走+Band+Walk+教學\" target=\"_blank\" style=\"color:#38BDF8; font-weight:700; text-decoration:none; background:rgba(56,189,248,0.12); padding:4px 10px; border-radius:6px; border:1px solid rgba(56,189,248,0.3); display:inline-block; font-size:0.85rem;\">▶️ 觀看教學 ↗ ↗</a></td></tr>\n<tr><td><strong>單腳提踵 (Single Calf Raise)</strong></td><td>2 組 × 12–15 下／邊 (足踝推蹬剛性)</td><td><a href=\"https://www.youtube.com/results?search_query=單腳提踵+Single+Calf+Raise+教學\" target=\"_blank\" style=\"color:#38BDF8; font-weight:700; text-decoration:none; background:rgba(56,189,248,0.12); padding:4px 10px; border-radius:6px; border:1px solid rgba(56,189,248,0.3); display:inline-block; font-size:0.85rem;\">▶️ 觀看教學 ↗ ↗</a></td></tr>\n</tbody></table>\n<hr style=\"border:none; border-top:1px solid var(--border-color); margin:20px 0;\">\n<blockquote style=\"background:rgba(6,182,212,0.1); border-left:4px solid var(--accent-cyan); padding:10px 14px; margin:12px 0; border-radius:4px; font-size:0.9rem;\">⚠️ **肌力調整與安全規則：**</blockquote>\n<blockquote style=\"background:rgba(6,182,212,0.1); border-left:4px solid var(--accent-cyan); padding:10px 14px; margin:12px 0; border-radius:4px; font-size:0.9rem;\">1. 若出現關節疼痛、嚴重疲勞或睡眠不足，應果斷將主課減至 2 組或改做輕度活動度拉伸。</blockquote>\n<blockquote style=\"background:rgba(6,182,212,0.1); border-left:4px solid var(--accent-cyan); padding:10px 14px; margin:12px 0; border-radius:4px; font-size:0.9rem;\">2. 若出現尖銳疼痛，請立即停止該項訓練。</blockquote>\n<blockquote style=\"background:rgba(6,182,212,0.1); border-left:4px solid var(--accent-cyan); padding:10px 14px; margin:12px 0; border-radius:4px; font-size:0.9rem;\">3. 離心動作（如提踵）請維持 3 秒緩慢下降，勿快速摔落下彈。</blockquote>", "rev_html": "<h1 style=\"color:#F8FAFC; margin-top:28px; margin-bottom:14px; font-size:1.5rem;\">鐵人三項 hlon.com/training/training-plans/free-8-week-sprint-triathlon-training-plan\" target=\"_blank\" class=\"art-btn\">🔗 閱讀外網原始文章 ↗</a>\n                    </div>\n                </div>\n            </div>\n        </div>\n    ", "str_html": "<h1 style=\"color:#F8FAFC; margin-top:28px; margin-bottom:14px; font-size:1.5rem;\">🏋️ 2026-W31 第 31 週肌力訓練課表詳細內容</h1>\n<h3 style=\"color:#38BDF8; margin-top:20px; margin-bottom:8px;\">📌 本週肌力訓練安排</h3>\n<li style=\"margin-left:20px; margin-bottom:6px; color:var(--text-main);\"><strong>週一 & 週四（主課 A）：</strong> 專注下肢多關節推拉與髖關節主導動作（30–40 分鐘），保留 2–3 下餘裕。</li>\n<li style=\"margin-left:20px; margin-bottom:6px; color:var(--text-main);\"><strong>週三（短課模板）：</strong> 游泳後或晚間進行核心抗旋轉、抗側彎與足踝推蹬剛性訓練（15–20 分鐘）。</li>\n<li style=\"margin-left:20px; margin-bottom:6px; color:var(--text-main);\"><strong>週日（恢復與拉伸）：</strong> 全身滾筒放鬆與胸椎/髖關節活動度拉伸。</li>\n<hr style=\"border:none; border-top:1px solid var(--border-color); margin:20px 0;\">\n<h3 style=\"color:#38BDF8; margin-top:20px; margin-bottom:8px;\">🏋️ 主課 A（週一與週四執行，約 30–40 分鐘）</h3>\n<table class=\"table-custom\">\n<thead><tr><th>動作名稱</th><th>訓練目標與建議量</th><th>🎥 動作教學影片</th></tr></thead><tbody>\n<tr><td><strong>分腿蹲 (Split Squat)</strong></td><td>3 組 × 6–8 下／邊 (強化單腿力量與平衡)</td><td><a href=\"https://www.youtube.com/results?search_query=分腿蹲+Split+Squat+教學\" target=\"_blank\" style=\"color:#38BDF8; font-weight:700; text-decoration:none; background:rgba(56,189,248,0.12); padding:4px 10px; border-radius:6px; border:1px solid rgba(56,189,248,0.3); display:inline-block; font-size:0.85rem;\">▶️ 觀看教學 ↗ ↗</a></td></tr>\n<tr><td><strong>羅馬尼亞硬舉 (RDL)</strong></td><td>3 組 × 6–8 下 (強化臀大肌與大腿後側膕繩肌)</td><td><a href=\"https://www.youtube.com/results?search_query=羅馬尼亞硬舉+RDL+教學\" target=\"_blank\" style=\"color:#38BDF8; font-weight:700; text-decoration:none; background:rgba(56,189,248,0.12); padding:4px 10px; border-radius:6px; border:1px solid rgba(56,189,248,0.3); display:inline-block; font-size:0.85rem;\">▶️ 觀看教學 ↗ ↗</a></td></tr>\n<tr><td><strong>單腳硬舉 (Single Leg RDL)</strong></td><td>2 組 × 6–8 下／邊 (訓練腳踝與髖關節穩定)</td><td><a href=\"https://www.youtube.com/results?search_query=單腳硬舉+Single+Leg+RDL+教學\" target=\"_blank\" style=\"color:#38BDF8; font-weight:700; text-decoration:none; background:rgba(56,189,248,0.12); padding:4px 10px; border-radius:6px; border:1px solid rgba(56,189,248,0.3); display:inline-block; font-size:0.85rem;\">▶️ 觀看教學 ↗ ↗</a></td></tr>\n<tr><td><strong>側棒式 (Side Plank)</strong></td><td>2 組 × 30–45 秒／邊 (強化核心側向抗側彎能力)</td><td><a href=\"https://www.youtube.com/results?search_query=側棒式+Side+Plank+教學\" target=\"_blank\" style=\"color:#38BDF8; font-weight:700; text-decoration:none; background:rgba(56,189,248,0.12); padding:4px 10px; border-radius:6px; border:1px solid rgba(56,189,248,0.3); display:inline-block; font-size:0.85rem;\">▶️ 觀看教學 ↗ ↗</a></td></tr>\n<tr><td><strong>死蟲式 (Dead Bug)</strong></td><td>2 組 × 8–10 下／邊 (核心抗伸展能力)</td><td><a href=\"https://www.youtube.com/results?search_query=死蟲式+Dead+Bug+教學\" target=\"_blank\" style=\"color:#38BDF8; font-weight:700; text-decoration:none; background:rgba(56,189,248,0.12); padding:4px 10px; border-radius:6px; border:1px solid rgba(56,189,248,0.3); display:inline-block; font-size:0.85rem;\">▶️ 觀看教學 ↗ ↗</a></td></tr>\n<tr><td><strong>雙腳提踵 (Calf Raises)</strong></td><td>3 組 × 12–15 下 (加強小腿與跟腱強度)</td><td><a href=\"https://www.youtube.com/results?search_query=提踵+Calf+Raises+教學\" target=\"_blank\" style=\"color:#38BDF8; font-weight:700; text-decoration:none; background:rgba(56,189,248,0.12); padding:4px 10px; border-radius:6px; border:1px solid rgba(56,189,248,0.3); display:inline-block; font-size:0.85rem;\">▶️ 觀看教學 ↗ ↗</a></td></tr>\n</tbody></table>\n<hr style=\"border:none; border-top:1px solid var(--border-color); margin:20px 0;\">\n<h3 style=\"color:#38BDF8; margin-top:20px; margin-bottom:8px;\">⚡ 短課模板（週三執行，約 15–20 分鐘）</h3>\n<table class=\"table-custom\">\n<thead><tr><th>動作名稱</th><th>訓練目標與建議量</th><th>🎥 動作教學影片</th></tr></thead><tbody>\n<         const CURRENT_WEEK = 31;
        let selectedWeekNum = CURRENT_WEEK;

        function toggleMobileSidebar(open) {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if (open) {
                sidebar.classList.add('mobile-open');
                overlay.classList.add('mobile-open');
            } else {
                sidebar.classList.remove('mobile-open');
                overlay.classList.remove('mobile-open');
            }
        }

        function toggleDesktopSidebar() {
            const sidebar = document.getElementById('sidebar');
            const btn = document.getElementById('btnToggleDesktop');
            const isCollapsed = sidebar.classList.toggle('desktop-collapsed');
            if (btn) {
                btn.style.display = isCollapsed ? 'inline-flex' : 'none';
            }
        }

        function closeSidebar() {
            if (window.innerWidth <= 768) {
                toggleMobileSidebar(false);
            } else {
                toggleDesktopSidebar();
            }
        }

        function renderSidebar() {
            const listEl = document.getElementById('weekList');
            listEl.innerHTML = '';

            for (let w = 1; w <= 52; w++) {
                const data = WEEKS_DATA[w];
                if (!data) continue;

                const item = document.createElement('div');
                item.className = `week-item ${w === selectedWeekNum ? 'active' : ''}`;
                item.onclick = () => selectWeek(w);

                let badgeClass = 'badge-future';
                if (data.status_tag === 'Past') badgeClass = 'badge-past';
                if (data.status_tag === 'Current') badgeClass = 'badge-current';

                item.innerHTML = `
                    <div>
                        <div class="week-title">第 ${w} 週 (W${String(w).padStart(2, '0')})</div>
                        <div class="week-dates">${data.date_range} | ${data.phase}</div>
                    </div>
                    <span class="badge-status ${badgeClass}">${data.status_label}</span>
                `;
                listEl.appendChild(item);
            }
        }

        function selectWeek(wNum) {
            selectedWeekNum = wNum;
            renderSidebar();
            renderMainContent(wNum);
            if (window.innerWidth <= 768) {
                toggleMobileSidebar(false);
            }
        }

        function openSubtab(tabName) {
