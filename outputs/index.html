<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrainingPeaks 52 週運動自動化全景儀表板 (網頁版內容閱覽)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0F172A;
            --bg-sidebar: #1E293B;
            --bg-card: #1E293B;
            --bg-card-hover: #334155;
            --accent-cyan: #06B6D4;
            --accent-blue: #3B82F6;
            --accent-green: #10B981;
            --accent-orange: #F59E0B;
            --accent-red: #EF4444;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --border-color: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        /* NAVIGATION TOGGLE & OVERLAY */
        .sidebar-header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .btn-toggle-desktop, .btn-toggle-mobile {
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.2), rgba(59, 130, 246, 0.2));
            border: 1px solid rgba(56, 189, 248, 0.4);
            color: #38BDF8;
            padding: 7px 12px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .btn-toggle-desktop:hover, .btn-toggle-mobile:hover {
            background: var(--accent-cyan);
            color: #0F172A;
            border-color: transparent;
        }
        .btn-close-sidebar {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.78rem;
            cursor: pointer;
        }
        .btn-close-sidebar:hover { color: #FFF; border-color: var(--accent-red); background: rgba(239, 68, 68, 0.2); }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(4px);
            z-index: 9998;
        }

        /* MOBILE RESPONSIVE LAYOUT (< 769px) */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
                height: auto;
                overflow-y: auto;
            }
            .sidebar {
                display: none;
                position: fixed;
                top: 0; left: 0;
                width: 290px;
                height: 100vh;
                z-index: 9999;
                box-shadow: 10px 0 30px rgba(0,0,0,0.8);
            }
            .sidebar.mobile-open {
                display: flex;
            }
            .sidebar-overlay.mobile-open {
                display: block;
            }
            .main-content {
                width: 100%;
                min-width: 0;
                padding: 16px 12px;
                overflow-x: hidden;
            }
            .main-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
            .subnav-tabs {
                flex-wrap: wrap;
                gap: 6px;
            }
            .subtab-btn {
                flex: 1 1 45%;
                font-size: 0.82rem;
                padding: 8px 6px;
            }
            .grid-kpi, .target-grid, .articles-grid {
                grid-template-columns: 1fr !important;
            }
            .table-custom {
                display: block;
                overflow-x: auto;
                white-space: nowrap;
                width: 100%;
            }
            .btn-toggle-desktop { display: none !important; }
        }

        /* DESKTOP COLLAPSED SIDEBAR (> 768px) */
        @media (min-width: 769px) {
            .btn-toggle-mobile { display: none !important; }
            .sidebar.desktop-collapsed {
                display: none;
            }
        }

        /* SIDEBAR */
        .sidebar {
            width: 330px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            background: linear-gradient(135deg, #1E293B, #0F172A);
        }
        .sidebar-header h1 {
            font-size: 1.2rem;
            font-weight: 800;
            background: linear-gradient(90deg, #38BDF8, #818CF8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .sidebar-header .sub { font-size: 0.78rem; color: var(--text-muted); margin-top: 4px; }
        .sidebar-controls { padding: 10px 16px; border-bottom: 1px solid var(--border-color); }
        .btn-current {
            width: 100%;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
            color: #FFF;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
        }
        .week-list { flex: 1; overflow-y: auto; padding: 10px; }
        .week-item {
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 6px;
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .week-item:hover { background: var(--bg-card-hover); }
        .week-item.active {
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.2), rgba(59, 130, 246, 0.2));
            border-color: var(--accent-cyan);
        }
        .week-title { font-weight: 700; font-size: 0.9rem; }
        .week-dates { font-size: 0.75rem; color: var(--text-muted); }
        .badge-status { font-size: 0.72rem; padding: 2px 7px; border-radius: 10px; font-weight: 600; }
        .badge-past { background: rgba(16, 185, 129, 0.15); color: var(--accent-green); border: 1px solid rgba(16, 185, 129, 0.3); }
        .badge-current { background: rgba(6, 182, 212, 0.25); color: #38BDF8; border: 1px solid #38BDF8; }
        .badge-future { background: rgba(148, 163, 184, 0.15); color: var(--text-muted); border: 1px solid rgba(148, 163, 184, 0.3); }

        /* MAIN CONTENT */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 24px 32px;
        }
        .main-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border-color);
        }
        .subnav-tabs {
            display: flex;
            width: 100%;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }
        .subtab-btn {
            flex: 1;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.9rem;
            text-align: center;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .subtab-btn:hover, .subtab-btn.active {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
            color: #FFF;
            border-color: transparent;
        }
        .subtab-view { display: none; }
        .subtab-view.active { display: block; animation: fadeIn 0.25s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .grid-kpi {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 14px;
            margin-bottom: 20px;
        }
        .kpi-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px 18px;
        }
        .kpi-title { font-size: 0.78rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
        .kpi-val { font-size: 1.5rem; font-weight: 800; margin-top: 4px; }

        .section-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 22px;
            margin-bottom: 20px;
        }
        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #38BDF8;
            margin-bottom: 14px;
        }
        .table-custom {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.92rem;
            margin-top: 8px;
        }
        .table-custom th, .table-custom td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }
        .table-custom th {
            background: rgba(51, 65, 85, 0.5);
            color: #94A3B8;
            font-weight: 600;
        }
        .target-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-top: 10px;
        }
        .target-card { border-radius: 10px; padding: 12px; border: 1px solid var(--border-color); }
        .target-opt { background: rgba(16, 185, 129, 0.1); border-color: rgba(16, 185, 129, 0.4); }
        .target-neu { background: rgba(245, 158, 11, 0.1); border-color: rgba(245, 158, 11, 0.4); }
        .target-con { background: rgba(239, 68, 68, 0.1); border-color: rgba(239, 68, 68, 0.4); }
        .target-tag { font-weight: 700; font-size: 0.82rem; margin-bottom: 4px; }
        .target-opt .target-tag { color: var(--accent-green); }
        .target-neu .target-tag { color: var(--accent-orange); }
        .target-con .target-tag { color: var(--accent-red); }
        .target-time { font-size: 1.25rem; font-weight: 800; }
        .downloads { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
        .btn-dl {
            background: rgba(51, 65, 85, 0.6);
            border: 1px solid var(--border-color);
            color: #38BDF8;
            padding: 8px 12px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.82rem;
            font-weight: 600;
        }
        .btn-dl:hover { background: var(--accent-blue); color: #FFF; }

        /* ARTICLES CATEGORIZED CARDS & NAV CHIPS */
        .nav-quick-bar {
            position: sticky;
            top: 0;
            z-index: 90;
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 12px;
            padding: 10px 16px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            overflow-x: auto;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        }
        .nav-label { font-size: 0.85rem; font-weight: 700; color: #38BDF8; white-space: nowrap; }
        .nav-chip {
            padding: 6px 14px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.82rem;
            font-weight: 700;
            white-space: nowrap;
            transition: all 0.2s ease;
        }
        .chip-summary { background: rgba(245, 158, 11, 0.15); color: #FBBF24; border: 1px solid rgba(245, 158, 11, 0.4); }
        .chip-swim { background: rgba(6, 182, 212, 0.15); color: #22D3EE; border: 1px solid rgba(6, 182, 212, 0.4); }
        .chip-bike { background: rgba(59, 130, 246, 0.15); color: #60A5FA; border: 1px solid rgba(59, 130, 246, 0.4); }
        .chip-run { background: rgba(245, 158, 11, 0.15); color: #FBBF24; border: 1px solid rgba(245, 158, 11, 0.4); }
        .chip-recovery { background: rgba(16, 185, 129, 0.15); color: #34D399; border: 1px solid rgba(16, 185, 129, 0.4); }
        .chip-home { background: rgba(56, 189, 248, 0.15); color: #38BDF8; border: 1px solid rgba(56, 189, 248, 0.4); }
        .nav-chip:hover { transform: translateY(-2px); filter: brightness(1.2); }

        .summary-box {
            background: linear-gradient(135deg, rgba(30,41,59,0.8), rgba(15,23,42,0.9));
            border: 1px solid rgba(245,158,11,0.4);
            border-radius: 14px;
            padding: 22px;
            margin-bottom: 28px;
            box-shadow: 0 4px 16px rgba(245,158,11,0.1);
        }
        .summary-box h2 { color: #FBBF24; font-size: 1.2rem; margin-bottom: 14px; }
        .cat-group { margin-bottom: 32px; }
        .cat-header {
            font-size: 1.25rem;
            color: #38BDF8;
            margin-bottom: 14px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border-color);
            scroll-margin-top: 70px;
        }
        .articles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 18px;
        }
        .art-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.2s ease;
        }
        .art-card:hover {
            border-color: var(--accent-cyan);
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        .art-title { font-size: 1.05rem; font-weight: 700; color: #F8FAFC; margin-bottom: 8px; line-height: 1.4; }
        .art-title a { color: #38BDF8; text-decoration: none; }
        .art-title a:hover { color: var(--accent-cyan); text-decoration: underline; }
        .art-meta { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 10px; line-height: 1.5; }
        .art-desc {
            font-size: 0.88rem;
            color: #CBD5E1;
            background: rgba(15, 23, 42, 0.5);
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 14px;
            flex: 1;
            line-height: 1.6;
        }
        .art-footer { display: flex; justify-content: flex-end; }
        .art-btn {
            background: rgba(6, 182, 212, 0.15);
            border: 1px solid rgba(6, 182, 212, 0.4);
            color: var(--accent-cyan);
            padding: 8px 14px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.84rem;
            font-weight: 700;
            transition: all 0.2s ease;
        }
        .art-btn:hover { background: var(--accent-cyan); color: #0F172A; }
        .ext-link { color: #38BDF8; text-decoration: none; }
        .ext-link:hover { text-decoration: underline; }
        .ext-icon { font-size: 0.8em; color: var(--accent-cyan); }
    </style>
</head>

rap:wrap; gap:8px;\">\n            <span>🧭 教練視角綜合解析與後續建議 (Daily & Weekly Coach Insights)</span>\n            <span style=\"font-size:0.75rem; background:rgba(56,189,248,0.15); color:#38BDF8; border:1px solid rgba(56,189,248,0.3); padding:3px 8px; border-radius:6px; font-weight:600;\">✨ 每日自動更新即時同步</span>\n        </div>\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; margin-top: 14px;\">\n            <div style=\"background: rgba(15, 23, 42, 0.6); padding: 14px 18px; border-radius: 10px; border: 1px solid rgba(16, 185, 129, 0.3);\">\n                <div style=\"font-weight: 700; color: #34D399; margin-bottom: 8px; font-size: 0.92rem;\">🌟 執行亮點與成效分析</div>\n                <div style=\"font-size: 0.86rem; color: #E2E8F0; line-height: 1.7;\">\n                    • 本週已累積單車 <strong>111.91 km</strong>、跑步 <strong>14.04 km</strong>、游泳 <strong>9.55 km</strong>，整體訓練節奏扎實推進中。<br>• 游泳與單車 4 週滾動均量皆達到 Sub-11 標竿需求。\n                </div>\n            </div>\n            <div style=\"background: rgba(15, 23, 42, 0.6); padding: 14px 18px; border-radius: 10px; border: 1px solid rgba(245, 158, 11, 0.3);\">\n                <div style=\"font-weight: 700; color: #FBBF24; margin-bottom: 8px; font-size: 0.92rem;\">⚠️ 需注意的細節與配速紀律</div>\n                <div style=\"font-size: 0.86rem; color: #E2E8F0; line-height: 1.7;\">\n                    • <strong>單車控瓦</strong>：目標巡航 140W-145W，爬坡上限 174W，下車前 10-15km 降瓦至 123W-133W 冷卻。<br>• <strong>跑步步頻</strong>：維持 175-180 spm，減輕關節衝擊，保護全馬下半程。\n                </div>\n            </div>\n            <div style=\"background: rgba(15, 23, 42, 0.6); padding: 14px 18px; border-radius: 10px; border: 1px solid rgba(56, 189, 248, 0.3);\">\n                <div style=\"font-weight: 700; color: #38BDF8; margin-bottom: 8px; font-size: 0.92rem;\">🧪 賽後恢復與能量補給指南</div>\n                <div style=\"font-size: 0.86rem; color: #E2E8F0; line-height: 1.7;\">\n                    • 訓練後即刻補充水份、電解質與 25g 蛋白質。<br>• 保持每晚 7.5–8.5 小時高品質深度睡眠，加速神經與肌肉修復。\n                </div>\n            </div>\n        </div>\n    </div>\n    ", "art_html": "<p style='color:var(--text-muted);'>該週尚未產生鐵人新知報告</p>", "str_html": "<h1 style=\"color:#F8FAFC; margin-top:28px; margin-bottom:14px; font-size:1.5rem;\">🏋️ 2026-W27 第 27 週肌力訓練課表詳細內容</h1>\n<h3 style=\"color:#38BDF8; margin-top:20px; margin-bottom:8px;\">📌 本週肌力訓練安排</h3>\n<li style=\"margin-left:20px; margin-bottom:6px; color:var(--text-main);\"><strong>週一 & 週四（主課 A）：</strong> 專注下肢多關節推拉與髖關節主導動作（30–40 分鐘），保留 2–3 下餘裕。</li>\n<li style=\"margin-left:20px; margin-bottom:6px; color:var(--text-main);\"><strong>週三（短課模板）：</strong> 游泳後或晚間進行核心抗旋轉、抗側彎與足踝推蹬剛性訓練（15–20 分鐘）。</li>\n<li style=\"margin-left:20px; margin-bottom:6px; color:var(--text-main);\"><strong>週日（恢復與拉伸）：</strong> 全身滾筒放鬆與胸椎/髖關節活動度拉伸。</li>\n<hr style=\"border:none; border-top:1px solid var(--border-color); margin:20px 0;\">\n<h3 style=\"color:#38BDF8; margin-top:20px; margin-bottom:8px;\">🏋️ 主課 A（週一與週四執行，約 30–40 分鐘）</h3>\n<table class=\"table-custom\">\n<thead><tr><th>動作名稱</th><th>訓練目標與建議量</th><th>🎥 動作教學影片</th></tr></thead><tbody>\n<tr><td><strong>分腿蹲 (Split Squat)</strong></td><td>3 組 × 6–8 下／邊 (強化單腿力量與平衡)</td><td><a href=\"https://www.youtube.com/results?search_query=分腿蹲+Split+Squat+教學\" target=\"_blank\" style=\"color:#38BDF8; font-weight:700; text-decoration:none; background:rgba(56,189,248,0.12); padding:4px 10px; border-radius:6px; border:1px solid rgba(56,189,248,0.3); display:inline-block; font-size:0.85rem;\">▶️ 觀看教學 ↗ ↗</a></td></tr>\n<tr><td><strong>羅馬尼亞硬舉 (RDL)</strong></td><td>3 組 × 6–8 下 (強化臀大肌與大腿後側膕繩肌)</td><td><a href=\"https://www.youtube.com/results?search_query=羅馬尼亞硬舉+RDL+教學\" target=\"_blank\" style=\"color:#38BDF8; font-weight:700; text-decoration:none; background:rgba(56,189,248,0.12); padding:4px 10px; border-radius:6px; border:1px solid rgba(56,189,248,0.3); display:inline-block; font-size:0.85rem;\">▶️ 觀看教學 ↗ ↗</a></td></tr>\n<tr><td><strong>單腳硬舉 (Single Leg RDL)</strong></td>                <div style=\"font-size: 0.86rem; color: #E2E8F0; line-height: 1.7;\">\n                    • 本週已累積單車 <strong>33.64 km</strong>、跑步 <strong>4.59 km</strong>、游泳 <strong>10.72 km</strong>，整體訓練節奏扎實推進中。<br>• 游泳與單車 4 週滾動均量皆達到 Sub-11 標竿需求。\n                </div>\n            </div>\n            <div style=\"background: rgba(15, 23, 42, 0.6); padding: 14px 18px; border-radius: 10px; border: 1px solid rgba(245, 158, 11, 0.3);\">\n                <div style=\"font-weight: 700; color: #FBBF24; margin-bottom: 8px; font-size: 0.92rem;\">⚠️ 需注意的細節與配速紀律</div>\n                <div style=\"font-size: 0.86rem; color: #E2E8F0; line-height: 1.7;\">\n                    • <strong>單車控瓦</strong>：目標巡航 140W-145W，爬坡上限 174W，下車前 10-15km 降瓦至 123W-133W 冷卻。<br>• <strong>跑步步頻</strong>：維持 175-180 spm，減輕關節衝擊，保護全馬下半程。\n                </div>\n            </div>\n            <div style=\"background: rgba(15, 23, 42, 0.6); padding: 14px 18px; border-radius: 10px; border: 1px solid rgba(56, 189, 248, 0.3);\">\n                <div style=\"font-weight: 700; color: #38BDF8; margin-bottom: 8px; font-size: 0.92rem;\">🧪 賽後恢復與能量補給指南</div>\n                <div style=\"font-size: 0.86rem; color: #E2E8F0; line-height: 1.7;\">\n                    • 訓練後即刻補充水份、電解質與 25g 蛋白質。<br>• 保持每晚 7.5–8.5 小時高品質深度睡眠，加速神經與肌肉修復。\n                </div>\n            </div>\n        </div>\n    </div>\n    ", "art_html": "\n        <!-- QUICK JUMP CATEGORY NAV BAR -->\n        <div class=\"nav-quick-bar\">\n            <span class=\"nav-label\">⚡ 分類快速導覽：</span>\n            \n            <a href=\"#summary\" class=\"nav-chip chip-summary\">🌟 綜合重點 SUMMARY</a>\n            <a href=\"#swim\" class=\"nav-chip chip-swim\">🏊 游泳 SWIM</a>\n            <a href=\"#bike\" class=\"nav-chip chip-bike\">🚴 騎車 BIKE</a>\n            <a href=\"#run\" class=\"nav-chip chip-run\">🏃 跑步 RUN</a>\n            <a href=\"#recovery\" class=\"nav-chip chip-recovery\">🥗 補給及恢復 RECOVERY</a>\n        </div>\n\n        <div class=\"summary-box\" id=\"summary\"><h2>🌟 五、 當週各項運動新知綜合整理重點</h2><div><br><h3 style='color:#38BDF8; margin-top:16px; margin-bottom:8px;'>游泳 (Swimming)核心要點<br>* **從足球到鐵人三項的陷阱：為什麼菁英投球技巧經常在球場上失敗**：他們擁有馬拉松運動員的肺部和短跑運動員的雙腿，但將世界盃傳奇人物放在鐵人三項起跑線上，你可能會看到一場巨大的掙扎。從「沉或遊」技術失敗到<br>* **英國選手 Harry Palmer 和 Lizzie Rayner 憑藉精彩表演贏得了非潛水服 Ironman 70.3 斯旺西比賽**：富有挑戰性的賽道和世界一流的場地帶來了競爭激烈、充滿活力和快速的比賽，Harry Palmer（英國）和 Lizzie Rayner（英國）最終獲得了 2026 年 IRONMAN 70.3 斯旺西冠軍，並<br>* **Leonie Periault 贏得 WTCS 漢堡女子比賽冠軍，將 2025 年成績縮短了 30 秒**：法國鐵人三項運動員萊昂妮·佩里奧 (Leonie Periault) 在 2025 年 WTCS 漢堡站上以閃電般的速度獲勝後，將比賽時間縮短了整整 30 秒，而英國選手貝絲·波特 (Beth Potter) 則繼續保持領先地位…<br><br><h3 style='color:#38BDF8; margin-top:16px; margin-bottom:8px;'>騎車 (Cycling)核心要點<br>* **Litespeed 的 Ultimate G2：一款出色的鈦合金礫石自行車**：當談到 N+1 或 N+2 自行車時，業界為我們提供了許多選擇。感謝老派騎手和小型定製商店…<br>Litespeed 的 Ultimate G2 後：鈦礫石<br>* **這是未來的自行車嗎？我們駕駛新款 Canyon Speedmax CFR 進行比賽**：Canyon 最高端的最新產品提供了開箱即用的專業級規格和客製化功能，並將焦點從自行車本身轉移到騎士身上。從拆箱到比賽，我們揭曉是否<br>* **2026 年鐵人三項比賽和訓練的最佳公路自行車**：正在尋找一款可用於訓練和鐵人三項比賽的新型公路自行車？讓我們來看看一些適合各種預算和願望的最佳選擇<br><br><h3 style='color:#38BDF8; margin-top:16px; margin-bottom:8px;'>跑步 (Running)核心要點<br>* **田徑跑步初學者指南**：從禮儀到鞋子，您需要了解的一切。<br>《田徑跑步初學者指南》一文首次出現在 Slowtwitch News 上。<br>* **Max 緩震鞋會讓我們成為懶惰的跑者嗎？**：極繁主義跑鞋是否會讓跑步變得更容易，或者它們會透過消除自然力量而削弱腳部和腿部肌肉？<br>* **漢堡世界鐵人三項賽：佩里奧和豪瑟贏得 WTCS 金牌，法國奪得混合接力冠軍，WTPS 首次亮相**：在週六炎熱而快速的衝刺比賽中，WTCS 賽跑比賽展開了一場勢均力敵、戲劇性的比賽，而混合接力賽和 WTPS 比賽則為週日的比賽增添了戲劇性。<br>閱讀世界鐵人三項賽的完整文章<br><br><h3 style='color:#38BDF8; margin-top:16px; margin-bottom:8px;'>補給與恢復 (Fueling & Recovery)核心要點<br>* **一位神經科學家的不插電訓練案例**：想要升級嗎？從拔掉插頭開始。 Daya Grant 博士解釋瞭如何透過將模擬訓練課程納入您的日常生活中來消除乾擾並重新集中註意力，以提高表現並<br>* **Alex Yee：背景、職業亮點、引言**：四屆奧運獎牌得主亞歷克斯·易 (Alex Yee) 的職業鐵人三項生涯可能起步很順利，但通往頂峰的旅程卻很漫長。他是這樣做的<br>* **我們注意到：斯旺西和維多利亞-加斯特伊茲等地的 70.3**：歐洲 IRONMAN 賽事和 XTERRA 南美錦標賽回顧​​。<br>我們注意到：斯旺西和維多利亞-加斯特伊茲等地的 70.3 的帖子首先出現在 Slowtwitch News 上。<br><br></div></div>\n\n        \n        <div class=\"cat-group\">\n            <h2 class=\"cat-header\" id=\"swim\">游泳 (Swimming) (9 篇)</h2>\n            <div class=\"articles-grid\">\ 始文章 ↗</a>\n                    </div>\n                </div>\n                <div class=\"art-card\">\n                    <div class=\"art-title\">🔗 <a href=\"https://www.triathlete.com/culture/news/how-the-survival-of-the-shawangunks-triathlon-survived-40-years-of-change/\" target=\"_blank\" class=\"ext-link\">Shawangunks 鐵人三項賽如何在 40 年的變化中倖存下來 <span class=\"ext-icon\">↗</span></a></div>\n                    <div class=\"art-meta\"><br>**英文原名**: *How the Survival of the Shawangunks Triathlon Survived 40 Years of Change*<br>**來源**: Triathlete Magazine | **日期**: 2026-07-21</div>\n                    <div class=\"art-desc\">\n                        <div style=\"font-weight: 700; color: #38BDF8; font-size: 0.85rem; margin-bottom: 8px;\">💡 【繁體中文 3 大重點摘要】</div>\n                        <div style=\"line-height: 1.6; color: #E2E8F0; font-size: 0.88rem;\">\n                            從救生員的訓練火花到傳奇的點對點耐力挑戰，Davis 家族回顧了 Shawangunks 鐵人三項賽的 40 年生存歷程。\n                        </div>\n                    </div>\n                    <div class=\"art-footer\">\n                        <a href=\"https://www.triathlete.com/culture/news/how-the-survival-of-the-shawangunks-triathlon-survived-40-years-of-change/\" target=\"_blank\" class=\"art-btn\">🔗 閱讀外網原始文章 ↗</a>\n                    </div>\n                </div>\n                <div class=\"art-card\">\n                    <div class=\"art-title\">🔗 <a href=\"https://www.triathlete.com/training/workouts/30-minute-strength-routine-for-triathlon/\" target=\"_blank\" class=\"ext-link\">這個 30 分鐘的肌力訓練可以防止受傷並為鐵人三項賽提供穩定性 <span class=\"ext-icon\">↗</span></a></div>\n                    <div class=\"art-meta\"><br>**英文原名**: *This 30-Minute Strength Routine Can Prevent Injury and Provide Stability for Triathlon*<br>**來源**: Triathlete Magazine | **日期**: 2026-07-21</div>\n                    <div class=\"art-desc\">\n                        <div style=\"font-weight: 700; color: #38BDF8; font-size: 0.85rem; margin-bottom: 8px;\">💡 【繁體中文 3 大 on\">↗</span></a></div>\n                    <div class=\"art-meta\"><br>**英文原名**: *We Noticed: Knibb Takes Edmonton World Cup, and More*<br>**來源**: Slowtwitch | **日期**: 2026-07-21</div>\n                    <div class=\"art-desc\">\n                        <div style=\"font-weight: 700; color: #38BDF8; font-size: 0.85rem; margin-bottom: 8px;\">💡 【繁體中文 3 大重點摘要】</div>\n                        <div style=\"line-height: 1.6; color: #E2E8F0; font-size: 0.88rem;\">\n                            這位美國長距離和短程明星重返頒獎台，以及來自鐵人三項世界的更多新聞。\n                        </div>\n                    </div>\n                    <div class=\"art-footer\">\n                        <a href=\"https://www.slowtwitch.com/triathlon/we-noticed-knibb-takes-edmonton-world-cup-and-more/\" target=\"_blank\" class=\"art-btn\">🔗 閱讀外網原始文章 ↗</a>\n                    </div>\n                </div>\n                <div class=\"art-card\">\n                    <div class=\"art-title\">🔗 <a href=\"https://www.triathlete.com/training/female-endurance-advantage-fatigue-resistance/\" target=\"_blank\" class=\"ext-link\">女性比男性更能抵抗疲勞。這有關係嗎？ <span class=\"ext-icon\">↗</span></a></div>\n                    <div class=\"art-meta\"><br>**英文原名**: *Women Resist Fatigue Better than Men. Does It Matter?*<br>**來源**: Triathlete Magazine | **日期**: 2026-07-20</div>\n                    <div class=\"art-desc\">\n                        <div style=\"font-weight: 700; color: #38BDF8; font-size: 0.85rem; margin-bottom: 8px;\">💡 【繁體中文 3 大重點摘要】</div>\n                        <div style=\"line-height: 1.6; color: #E2E8F0; font-size: 0.88rem;\">\n                            新的證據支持了女性生理機能決定耐力的說法。但這並不是 Rachel Entrekin 贏得 Cocodona 250 比賽的原因。\n                        </div>\n                    </div>\n                    <div class=\"art-footer\">\n                        <a href=\"https://www.triathlete.com/training/female-endurance-advantage-fatigue-resistance/\" target=\"_blank\" class=\"art-btn\">🔗 閱讀外網原始文章 ↗</a>\n x; border: 1px solid rgba(255,255,255,0.08);\">\n                💡 <strong>【單車強度與功率紀律】</strong> 實際完成 7.45 km (時間 0.50h)。對比 <strong>Sub-11 藍圖 (5h30m / 140W-145W)</strong>：本次訓練耐力扎實。注意事項：長騎或 Tempo 區間衝刺時請嚴格守住 174W (85% FTP) 上限，切勿冒進衝瓦以防耗損全馬雙腿剛性；下車前 10–15km 主動降瓦至 123W-133W 冷卻有氧，騎乘中每小時補給 60-90g 碳水與 600-900ml 電解質。\n            </div>\n        </div>\n        \n\n        <div style=\"background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border-color); border-left: 4px solid #F59E0B; border-radius: 10px; padding: 14px 18px; margin-bottom: 12px;\">\n            <div style=\"display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 8px;\">\n                <div style=\"font-weight: 700; font-size: 0.96rem; color: #F8FAFC;\">\n                    🏃‍♂️ <span style=\"color: #F59E0B;\">08/03 (週一)</span> Run: Running\n                </div>\n                <span style=\"font-size: 0.76rem; background: rgba(56, 189, 248, 0.15); color: #38BDF8; border: 1px solid rgba(56, 189, 248, 0.3); padding: 3px 8px; border-radius: 6px; font-weight: 600;\">完成率 93%</span>\n            </div>\n            <div style=\"font-size: 0.86rem; color: #CBD5E1; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px dashed rgba(255,255,255,0.1); line-height: 1.8;\">\n                ⏱️ 實際時間：<strong>84 分 (1.40 hr)</strong> ｜ 📏 實際距離：<strong>11.58 km</strong>\n            </div>\n            <div style=\"font-size: 0.88rem; color: #E2E8F0; line-height: 1.7; background: rgba(30, 41, 59, 0.5); padding: 12px 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08);\">\n                💡 <strong>【跑步配速與落地剛性】</strong> 實際完成 11.58 km (時間 84分)。對比 <strong>Sub-11 藍圖 (4h00m / 5:41/km)</strong>：節奏掌控穩定。注意事項：請維持步頻 175–180 bpm 減輕膝關節負擔；跑後 30 分鐘內請補給 25g 蛋白質與碳水，修復肌纖維，為週末 LSD 與 90 分鐘轉換跑奠定衝擊剛性。\n            </div>\n        </div>\n        ", "coach_insights_box_html": "\n    <div class=\"section-box\" style=\"border-left: 4px solid #38BDF8; background: linear-gradient(135deg, rgba(30,41,59,0.85), rgba(15,23,42,0.95)); margin-bottom: 20px;\">\n        <div class=\"section-title\" style=\"display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;\">\n            <span>🧭 教練視角綜合解析與後續建議 (Daily & Weekly Coach Insights)</span>\n            <span style=\"font-size:0.75rem; background:rgba(56,189,248,0.15); color:#38BDF8; border:1px solid rgba(56,189,248,0.3); padding:3px 8px; border-radius:6px; font-weight:600;\">✨ 每日自動更新即時同步</span>\n        </div>\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; margin-top: 14px;\">\n            <div style=\"background: rgba(15, 23, 42, 0.6); padding: 14px 18px; border-radius: 10px; border: 1px solid rgba(16, 185, 129, 0.3);\">\n                <div style=\"font-weight: 700; color: #34D399; margin-bottom: 8px; font-size: 0.92rem;\">🌟 執行亮點與成效分析</div>\n                <div style=\"font-size: 0.86rem; color: #E2E8F0; line-height: 1.7;\">\n                    • 本週已累積單車 <strong>270.06 km</strong>、跑步 <strong>34.54 km</strong>、游泳 <strong>10.00 km</strong>，整體訓練節奏扎實推進中。<br>• 游泳與單車 4 週滾動均量皆達到 Sub-11 標竿需求。\n                </div>\n            </div>\n            <div style=\"background: rgba(15, 23, 42, 0.6); padding: 14px 18px; border-radius: 10px; border: 1px solid rgba(245, 158, 11, 0.3);\">\n                <div style=\"font-weight: 700; color: #FBBF24; margin-bottom: 8px; font-size: 0.92rem;\">⚠️ 需注意的細節與配速紀律</div>\n                <div style=\"font-size: 0.86rem; color: #E2E8F0; line-height: 1.7;\">\n                    • <strong>單車控瓦</strong>：目標巡航 140W-145W，爬坡上限 174W，下車前 10-15km 降瓦至 123W-133W 冷卻。<br>• <strong>跑步步頻</strong>：維持 175-180 spm，減輕關節衝擊，保護全馬下半程。\n                </div>\n            </div>\n            <div style=\"background: rgba(15, 23, 42, 0.6); padding: 14px 18px; border-radius: 10px; border: 1px solid rgba(56, 189, 248, 0.3);\">\n                <div style=\"font-weight: 700; color: #38BDF8; margin-bottom: 8px; font-size: 0.92rem;\">🧪 賽後恢復與能量補給指南</div>\n                <div style=\"font-size: 0.86rem; color: #E2E8F0; line-height: 1.7;\">\n                    • 訓練後即刻補充水份、電解質與 25g 蛋白質。<br>• 保持每晚 7.5–8.5 小時高品質深度睡眠，加速神經與肌肉修復。\n                </div>\n            </div>\n        </div>\n    </div>\n    ", "art_html": "\n        <!-- QUICK JUMP CATEGORY NAV BAR -->\n        <div class=\"nav-quick-bar\">\n            <span class=\"nav-label\">⚡ 分類快速導覽：</span>\n            \n            <a href=\"#summary\" class=\"nav-chip chip-summary\">🌟 綜合重點 SUMMARY</a>\n            <a href=\"#swim\" class=\"nav-chip chip-swim\">🏊 游泳 SWIM</a>\n            <a href=\"#bike\" class=\"nav-chip chip-bike\">🚴 騎車 BIKE</a>\n            <a href=\"#run\" class=\"nav-chip chip-run\">🏃 跑步 RUN</a>\n            <a href=\"#recovery\" class=\"nav-chip chip-recovery\">🥗 補給及恢復 RECOVERY</a>\n        </div>\n\n        <div class=\"summary-box\" id=\"summary\"><h2>🌟 五、 當週各項運動新知綜合整理重點</h2><div><br><h3 style='color:#38BDF8; margin-top:16px; margin-bottom:8px;'>游泳 (Swimming)核心要點<br>* **我把肌力訓練換成了鐵人三項訓練──我失去了力量嗎？**：1. 經過數月的追逐力量個人最佳成績後，訓練220米鐵人三項賽作家India Paine將舉重改為游泳、騎自行車和跑步，為她的第一個T100進行；<br>2. 但三個月後減少；<br>3. 提供鐵人三項選手在實務備賽、運動防傷與體能恢復上的具體應用指導。。<br>* **H2O Audio TRI 2 PRO 和 TRI Run：適合長途的聲音**：1. H2O Audio TRI 2 PRO 與 TRI Run：雙人開放式骨耳機經過游泳、騎乘和跑步測試；<br>2. 您屬於哪一個訓練週；<br>3. H2O Audio TRI 2 PRO 和 TRI Run 後：聲音。<br>* **什麼是最好的游泳換衣袍？我是一名游泳教練，這是我穿著以保持溫暖和乾燥的 10 件長袍**：1. 在戶外游泳並需要一件優質的換尿布來保持溫暖和乾燥；<br>2. 戶外游泳教練海倫·韋伯斯特測試了市場上最好的一些；<br>3. 提供鐵人三項選手在實務備賽、運動防傷與體能恢復上的具體應用指導。。<br><br><h3 style='color:#38BDF8; margin-top:16px; margin-bottom:8px;'>騎車 (Cycling)核心要點<br>* **FastTT 的鐵人三項空氣動力桿專為速度、舒適性和穩定性而設計**：1. 我不是自行車整合工，也不是風洞專家；<br>2. 我只是一名普通鐵人三項運動員，正在尋找我現有隊長的升級，組成成為一名普通鐵人三項運動員；<br>3. Post FastTT 的 Triathlon Aero Bar 的設計。<br>* **通往偉大的四條路：世巡賽球隊的教練理念**：1. 每個團隊都在追求偉大，但並不代表他們都走同樣的路；<br>2. 四位世巡賽教練分享了他們為世界上最大的自行車比賽做準備的理念之一；<br>3. 提供鐵人三項選手在實務備賽、運動防傷與體能恢復上的具體應用指導。。<br>* **職業鐵人三項運動員分享他們在炎熱天氣下比賽的秘密**：1. 即使是最健康的鐵人三項運動員在炎熱的天氣下比賽；<br>2. 我們邀請職業選手分享 -height: 1.8;\">\n                ⏱️ 實際時間：<strong>86 分 (1.43 hr)</strong> ｜ 📏 實際距離：<strong>11.92 km</strong> ｜ 👟 平均配速：<strong>7:17 /km</strong>\n            </div>\n            <div style=\"font-size: 0.88rem; color: #E2E8F0; line-height: 1.7; background: rgba(30, 41, 59, 0.5); padding: 12px 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08);\">\n                💡 <strong>【跑步配速與落地剛性】</strong> 實際完成 11.92 km (時間 86分)。對比 <strong>Sub-11 藍圖 (4h00m / 5:41/km)</strong>：節奏掌控穩定。注意事項：請維持步頻 175–180 bpm 減輕膝關節負擔；跑後 30 分鐘內請補給 25g 蛋白質與碳水，修復肌纖維，為週末 LSD 與 90 分鐘轉換跑奠定衝擊剛性。\n            </div>\n        </div>\n        ", "coach_insights_box_html": "\n    <div class=\"section-box\" style=\"border-left: 4px solid #38BDF8; background: linear-gradient(135deg, rgba(30,41,59,0.85), rgba(15,23,42,0.95)); margin-bottom: 20px;\">\n        <div class=\"section-title\" style=\"display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;\">\n            <span>🧭 教練視角綜合解析與後續建議 (Daily & Weekly Coach Insights)</span>\n            <span style=\"font-size:0.75rem; background:rgba(56,189,248,0.15); color:#38BDF8; border:1px solid rgba(56,189,248,0.3); padding:3px 8px; border-radius:6px; font-weight:600;\">✨ 每日自動更新即時同步</span>\n        </div>\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; margin-top: 14px;\">\n            <div style=\"background: rgba(15, 23, 42, 0.6); padding: 14px 18px; border-radius: 10px; border: 1px solid rgba(16, 185, 129, 0.3);\">\n                <div style=\"font-weight: 700; color: #34D399; margin-bottom: 8px; font-size: 0.92rem;\">🌟 執行亮點與成效分析</div>\n                <div style=\"font-size: 0.86rem; color: #E2E8F0; line-height: 1.7;\">\n                    • <strong>【W33 大量週圓滿結算 (Big Weekend)】</strong> 全週累計游泳 <strong>10.70 km</strong>、自行車 <strong>188.36 km</strong>、跑步 <strong>37.20 km</strong>，總訓練時間突破 16 小時，總 TSS 突破 650，有氧底層極為厚實。<br>• <strong>【週日跑游雙主項高水準發揮】</strong> 8/16 清晨完成 17.52 km（含明德宮 +327m 爬坡，平路漸速至 5:26/km）；上午接續 4,100m 游泳，雙 1,600m 主項巡航繳出 1:56~1:58/100m 絕佳均速與 140 bpm 低心率！<br>• <strong>【極佳左右平衡與配速穩定性】</strong> 8/15 破百長騎 127.37 km（左右平衡 50.5%/49.5%）與 8/16 雙 1,600m 連續長游均展現頂尖的體能一致性。\n                </div>\n            </div>\n            <div style=\"background: rgba(15, 23, 42, 0.6); padding: 14px 18px; border-radius: 10px; border: 1px solid rgba(245, 158, 11, 0.3);\">\n                <div style=\"font-weight: 700; color: #FBBF24; margin-bottom: 8px; font-size: 0.92rem;\">⚠️ 需注意的細節與配速紀律</div>\n                <div style=\"font-size: 0.86rem; color: #E2E8F0; line-height: 1.7;\">\n                    • <strong>【長騎控瓦與有氧解離防線】</strong> 8/15 長騎 NP 172W (IF 0.84) 偏向競賽強度，未來長距離 LSD 前 3 小時務必壓制在 140W-150W (68-75% FTP)，下車前 10-15km 主動降瓦冷卻。<br>• <strong>【山道長跑心率與步頻轉換】</strong> 上坡路段維持 131-163 bpm 控心率、下坡迅速拉高步頻至 176-184 spm 減少煞車衝擊，對標 Sub-11 全馬 4 小時 (5:41/km) 節奏。<br>• <strong>【游泳長距離 1:53 巡航手感】</strong> 雙 1,600m 巡航在 140 bpm 游出 1:56-1:58/100m，可於後續課表逐步加入 100/200m 巡航配速游，目標直指 1:48-1:53/100m。\n                </div>\n            </div>\n            <div style=\"background: rgba(15, 23, 42, 0.6); padding: 14px 18px; border-radius: 10px; border: 1px solid rgba(56, 189, 248, 0.3);\">\n                <div style=\"font-weight: 700; color: #38BDF8; margin-bottom: 8px; font-size: 0.92rem;\">🧪 賽後恢復與能量補給指南</div>\n                <div style=\"font-size: 0.86rem; color: #E2E8F0; line-height: 1.7;\">\n                    • <strong>【週末雙大日深度修復】</strong> 連續兩天高強度與高量訓練累積近 540 TSS，請持續補充水分、電解質與每公斤 1.5–2.0g 優質蛋白質。<br>• <strong>【下肢與肩背肌群放鬆】</strong> 重點針對小腿阿基里斯腱、臀大肌、肩關節與闊背肌進行滾筒放鬆與深層伸展。<br>• <strong>【週一恢復日排程】</strong> 週一安排完全休息 (Rest Day) 或低心率排酸輕鬆游/滾筒活動度，讓神經與肌肉充分吸收本週超量訓練。\n                </div>\n            </div>\n        </div>\n    </div>\n    ", "art_html": "\n        <!-- QUICK JUMP CATEGORY NAV BAR -->\n        <div class=\"nav-quick-bar\">\n            <span class=\"nav-label\">⚡ 分類快速導覽：</span>\n            \n            <a href=\"#summary\" class=\"nav-chip chip-summary\">🌟 綜合重點 SUMMARY</a>\n            <a href=\"#swim\" class=\"nav-chip chip-swim\">🏊 游泳 SWIM</a>\n            <a href=\"#bike\" class=\"nav-chip chip-bike\">🚴 騎車 BIKE</a>\n            <a href=\"#run\" class=\"nav-chip chip-run\">🏃 跑步 RUN</a>\n            <a href=\"#recovery\" class=\"nav-chip chip-recovery\">🥗 補給及恢復 RECOVERY</a>\n        </div>\n\n        <div class=\"summary-box\" id=\"summary\"><h2>🌟 五、 當週各項運動新知綜合整理重點</h2><div><br><h3 style='color:#38BDF8; margin-top:16px; margin-bottom:8px;'>游泳 (Swimming)核心要點<br>* **「我喜歡這裡的氛圍！」Jonas Schomburg（德國）在卡爾馬首次贏得鐵人三項賽冠軍**：1. 在科納舉行的一場激動人心的鐵人三項世界冠軍資格賽決賽中，喬納斯·肖姆伯格（Jonas Shomburg）在比賽中取得領先，並以7小時22分57秒的令人印象深刻的成績贏得了他的第一場鐵人三項比賽；<br>2. 分析來自 220 Triathlon 針對 游泳 (Swimming) 項目的關鍵訓練與器材建議。；<br>3. 提供鐵人三項選手在實務備賽、運動防傷與體能恢復上的具體應用指導。。<br>* **利茲鐵人三項賽因擔心湖水品質而取消游泳**：1. 鐵人三項今天宣布，明天在利茲舉行的比賽將沒有游泳比賽，今天的練習游泳也將被取消；<br>2. 近期消息發布之際，人們對 Waterloo Lak 的品質感到擔憂…；<br>3. 提供鐵人三項選手在實務備賽、運動防傷與體能恢復上的具體應用指導。。<br>* **厭倦了相同的運動程序？這些快速游泳、騎自行車、跑步訓練可產生實際速度**：1. 透過這些經專家批准的訓練來改變您的季度訓練，挑戰您的身體並刷新您的思維；<br>2. 閱讀全文：厭了相同的運動項目；<br>3. 這些快速游泳、騎自行車…。<br><br><h3 style='color:#38BDF8; margin-top:16px; margin-bottom:8px;'>騎車 (Cycling)核心要點<br>* **騎乘營養：提高表現的最簡單的轉變**：1. 這不是配方補充劑；<br>2. 或騎自行車創作的碳水化合物；<br>3. 這可能只是你星期二吃的東西。<br>* **最適合運動的電解質是？我們測試最適合運動員的補水粉和片劑**：1. 運動時補充身體消耗量是鐵人三項運動員必須考慮的重要因素，但肥胖者該有多少消耗量，您如何知道要購買哪些呢？；<br>2. 我們嘗試並測試了 10 種方法來幫助您；<br>3. 提供鐵人三項選手在實務備賽、運動防傷與體能恢復上的具體應用指導。。<br>* **免費 3 個月鐵人三項基礎訓練計畫：從頭開始打造您的鐵人三項體能**：1. 有征服鋼鐵人的計劃嗎；<br>2. 德莫特·海耶斯說，那就不要忽視你的基礎；<br>3. 這是為期3個月的鐵人三項基礎訓練計劃，可幫助您為起跑線做好準備。<br><br><h3 style='color:#38BDF8; margin-top:16px; margin-bottom:8px;'>跑步 (Running)核心要點<br>* **「我飛出去了。我真的感覺很好！」Julie Derron 追趕 Kate Waugh 在溫哥華奪得 T100 職業賽季首場勝利**：1. 瑞士名將朱莉婭·德隆（Julia Derron）（瑞士）追趕回歸的英國T100世界冠軍凱特·沃（Kate Waugh）（英國），在溫哥華取得了本賽季首個T100勝利；<br>2. 喬治亞‧泰勒-布朗 (Georgia Taylor-Brown)；<br>3. 提供鐵人三項選手在實務備賽、運動防傷與體能恢復上的具體應用指導。。<br><br><h3 style='color:#38BDF8; margin-top:16px; margin-bottom:8px;'>補給與恢復 (Fueling & Recovery)核心要點<br>* **「今天天氣真好，風很大！」勞拉·菲利普 (Laura Philipp) 領先卡爾瑪 (Ironman Kalmar) 18 分鐘獲 ：<strong>6.24 km</strong> ｜ ⚡ 平均時速：<strong>11.25 km/h</strong>\n            </div>\n            <div style=\"font-size: 0.88rem; color: #E2E8F0; line-height: 1.7; background: rgba(30, 41, 59, 0.5); padding: 12px 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08);\">\n                💡 <strong>【單車強度與功率紀律】</strong> 實際完成 6.24 km (時間 0.55h)。對比 <strong>Sub-11 藍圖 (5h30m / 140W-145W)</strong>：本次訓練耐力扎實。注意事項：長騎或 Tempo 區間衝刺時請嚴格守住 174W (85% FTP) 上限，切勿冒進衝瓦以防耗損全馬雙腿剛性；下車前 10–15km 主動降瓦至 123W-133W 冷卻有氧，騎乘中每小時補給 60-90g 碳水與 600-900ml 電解質。\n            </div>\n        </div>\n        ", "coach_insights_box_html": "\n    <div class=\"section-box\" style=\"border-left: 4px solid #38BDF8; background: linear-gradient(135deg, rgba(30,41,59,0.85), rgba(15,23,42,0.95)); margin-bottom: 20px;\">\n        <div class=\"section-title\" style=\"display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;\">\n            <span>🧭 教練視角綜合解析與後續建議 (Daily & Weekly Coach Insights)</span>\n            <span style=\"font-size:0.75rem; background:rgba(56,189,248,0.15); color:#38BDF8; border:1px solid rgba(56,189,248,0.3); padding:3px 8px; border-radius:6px; font-weight:600;\">✨ 每日自動更新即時同步</span>\n        </div>\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; margin-top: 14px;\">\n            <div style=\"background: rgba(15, 23, 42, 0.6); padding: 14px 18px; border-radius: 10px; border: 1px solid rgba(16, 185, 129, 0.3);\">\n                <div style=\"font-weight: 700; color: #34D399; margin-bottom: 8px; font-size: 0.92rem;\">🌟 執行亮點與成效分析</div>\n                <div style=\"font-size: 0.86rem; color: #E2E8F0; line-height: 1.7;\">\n                    • 本週已累積單車 <strong>6.24 km</strong>、跑步 <strong>9.45 km</strong>、游泳 <strong>3.15 km</strong>，整體訓練節奏扎實推進中。<br>• 游泳與單車 4 週滾動均量皆達到 Sub-11 標竿需求。\n                </div>\n            </div>\n            <div style=\"background: rgba(15, 23, 42, 0.6); padding: 14px 18px; border-radius: 10px; border: 1px solid rgba(245, 158, 11, 0.3);\">\n                <div style=\"font-weight: 700; color: #FBBF24; margin-bottom: 8px; font-size: 0.92rem;\">⚠️ 需注意的細節與配速紀律</div>\n                <div style=\"font-size: 0.86rem; color: #E2E8F0; line-height: 1.7;\">\n                    • <strong>單車控瓦</strong>：目標巡航 140W-145W，爬坡上限 174W，下車前 10-15km 降瓦至 123W-133W 冷卻。<br>• <strong>跑步步頻</strong>：維持 175-180 spm，減輕關節衝擊，保護全馬下半程。\n                </div>\n            </div>\n            <div style=\"background: rgba(15, 23, 42, 0.6); padding: 14px 18px; border-radius: 10px; border: 1px solid rgba(56, 189, 248, 0.3);\">\n                <div style=\"font-weight: 700; color: #38BDF8; margin-bottom: 8px; font-size: 0.92rem;\">🧪 賽後恢復與能量補給指南</div>\n                <div style=\"font-size: 0.86rem; color: #E2E8F0; line-height: 1.7;\">\n                    • 訓練後即刻補充水份、電解質與 25g 蛋白質。<br>• 保持每晚 7.5–8.5 小時高品質深度睡眠，加速神經與肌肉修復。\n                </div>\n            </div>\n        </div>\n    </div>\n    ", "art_html": "\n        <!-- QUICK JUMP CATEGORY NAV BAR -->\n        <div class=\"nav-quick-bar\">\n            <span class=\"nav-label\">⚡ 分類快速導覽：</span>\n            \n            <a href=\"#summary\" class=\"nav-chip chip-summary\">🌟 綜合重點 SUMMARY</a>\n            <a href=\"#swim\" class=\"nav-chip chip-swim\">🏊 游泳 SWIM</a>\n            <a href=\"#bike\" class=\"nav-chip chip-bike\">🚴 騎車 BIKE</a>\n            <a href=\"#run\" class=\"nav-chip chip-run\">🏃 跑步 RUN</a>\n            <a href=\"#recovery\" class=\"nav-chip chip-recovery\">🥗 補給及恢復 RECOVERY</a>\n        </div>\n\n        <div class=\"summary-box\" id=\"summary\"><h2>🌟 五、 當週各項運動新知綜合整理重點</h2><div><br><h3 style='color:#38BDF8; margin-top:16px; margin-bottom:8px;'>游泳 (Swimming)核心要點<br>* **「我喜歡這裡的氛圍！」Jonas Schomburg（德國）在卡爾馬首次贏得鐵人三項賽冠軍**：1. 在科納舉行的一場激動人心的鐵人三項世界冠軍資格賽決賽中，喬納斯·肖姆伯格（Jonas Shomburg）在比賽中取得領先，並以7小時22分57秒的令人印象深刻的成績贏得了他的第一場鐵人三項比賽；<br>2. 分析來自 220 Triathlon 針對 游泳 (Swimming) 項目的關鍵訓練與器材建議。；<br>3. 提供鐵人三項選手在實務備賽、運動防傷與體能恢復上的具體應用指導。。<br>* **利茲鐵人三項賽因擔心湖水品質而取消游泳**：1. 鐵人三項今天宣布，明天在利茲舉行的比賽將沒有游泳比賽，今天的練習游泳也將被取消；<br>2. 近期消息發布之際，人們對 Waterloo Lak 的品質感到擔憂…；<br>3. 提供鐵人三項選手在實務備賽、運動防傷與體能恢復上的具體應用指導。。<br>* **厭倦了相同的運動程序？這些快速游泳、騎自行車、跑步訓練可產生實際速度**：1. 透過這些經專家批准的訓練來改變您的季度訓練，挑戰您的身體並刷新您的思維；<br>2. 閱讀全文：厭了相同的運動項目；<br>3. 這些快速游泳、騎自行車…。<br><br><h3 style='color:#38BDF8; margin-top:16px; margin-bottom:8px;'>騎車 (Cycling)核心要點<br>* **騎乘營養：提高表現的最簡單的轉變**：1. 這不是配方補充劑；<br>2. 或騎自行車創作的碳水化合物；<br>3. 這可能只是你星期二吃的東西。<br>* **最適合運動的電解質是？我們測試最適合運動員的補水粉和片劑**：1. 運動時補充身體消耗量是鐵人三項運動員必須考慮的重要因素，但肥胖者該有多少消耗量，您如何知道要購買哪些呢？；<br>2. 我們嘗試並測試了 10 種方法來幫助您；<br>3. 提供鐵人三項選手在實務備賽、運動防傷與體能恢復上的具體應用指導。。<br>* **免費 3 個月鐵人三項基礎訓練計畫：從頭開始打造您的鐵人三項體能**：1. 有征服鋼鐵人的計劃嗎；<br>2. 德莫特·海耶斯說，那就不要忽視你的基礎；<br>3. 這是為期3個月的鐵人三項基礎訓練計劃，可幫助您為起跑線做好準備。<br><br><h3 style='color:#38BDF8; margin-top:16px; margin-bottom:8px;'>跑步 (Running)核心要點<br>* **Julie Derron 在 T100 巡迴賽中贏得杆位並贏得溫哥華大師賽冠軍**：1. 在女子T100世界巡迴賽的第三場比賽中，朱莉·德隆（Julie Derron）的表現堪稱完美，輕鬆擊敗了歸來的凱特·沃（Kate Waugh）；<br>2. 閱讀 Julie Derron Takes Pole 的完整文章；<br>3. 提供鐵人三項選手在實務備賽、運動防傷與體能恢復上的具體應用指導。。<br>* **「我飛出去了。我真的感覺很好！」Julie Derron 追趕 Kate Waugh 在溫哥華奪得 T100 職業賽季首場勝利**：1. 瑞士名將朱莉婭·德隆（Julia Derron）（瑞士）追趕回歸的英國T100世界冠軍凱特·沃（Kate Waugh）（英國），在溫哥華取得了本賽季首個T100勝利；<br>2. 喬治亞‧泰勒-布朗 (Georgia Taylor-Brown)；<br>3. 提供鐵人三項選手在實務備賽、運動防傷與體能恢復上的具體應用指導。。<br><br><h3 style='color:#38BDF8; margin-top:16px; margin-bottom:8px;'>補給與恢復 (Fueling & Recovery)核心要點<br>* **「今天天氣真好，風很大！」勞拉·菲利普 (Laura Philipp) 領先卡爾瑪 (Ironman Kalmar) 18 分鐘獲勝**：1. 德國選手勞拉·菲利普（Laura Philipp）在卡爾瑪鐵人三項賽上表演了頑強的毅力，在幾個月後的鐵人三項世界冠軍賽上表演了她的力量；<br>2. 卡爾瑪鋼鐵人提供了一個重要的時刻；<br>3. 提供鐵人三項選手在實務備賽、運動防傷與體能恢復上的具體應用指導。。<br>* **Julie Derron 贏得 2026 年溫哥華 T100 比賽 — 照片回顧比賽**：1. 照片中回顧了激動人心的一天比賽；<br>2. 朱莉·德隆（Julie Derron）贏得2026年溫哥華T100比賽——照片中的比賽回顧一文首次出現在Slowtwitch News上；<br>3. 提供鐵人三項選手在實務備賽、運動防傷與體能恢復上的具體應用指導。。<br>* **閃電般的鐵人三項卡爾瑪為勞拉·菲利普和喬納斯·朔姆堡贏得勝利預覽出色的科納形式**：1. 在一場破紀錄、擠滿觀眾的比賽中，勞拉·菲利普和喬納斯·朔姆伯格上演了一場令人難忘的表演，創造了歷史上最快的兩場鐵人三項錶演，並展示了世界冠軍；<br>2. 分析來自 Triathlete Magazine 針對 補給與恢復 (Fueling & Recovery) 項目的關鍵訓練與器材建議。；<br>3. 提供鐵人三項選手 <h3 style=\"color:#38BDF8; margin-top:20px; margin-bottom:8px;\">📌 本週肌力訓練安排</h3>\n<li style=\"margin-left:20px; margin-bottom:6px; color:var(--text-main);\"><strong>週一 & 週四（主課 B）：</strong> 專注下肢多關節推拉與髖關節主導動作（30–40 分鐘），保留 2–3 下餘裕。</li>\n<li style=\"margin-left:20px; margin-bottom:6px; color:var(--text-main);\"><strong>週三（短課模板）：</strong> 游泳後或晚間進行核心抗旋轉、抗側彎與足踝推蹬剛性訓練（15–20 分鐘）。</li>\n<li style=\"margin-left:20px; margin-bottom:6px; color:var(--text-main);\"><strong>週日（恢復與拉伸）：</strong> 全身滾筒放鬆與胸椎/髖關節活動度拉伸。</li>\n<hr style=\"border:none; border-top:1px solid var(--border-color); margin:20px 0;\">\n<h3 style=\"color:#38BDF8; margin-top:20px; margin-bottom:8px;\">🏋️ 主課 B（週一與週四執行，約 30–40 分鐘）</h3>\n<table class=\"table-custom\">\n<thead><tr><th>動作名稱</th><th>訓練目標與建議量</th><th>🎥 動作教學影片</th></tr></thead><tbody>\n<tr><td><strong>臀推或橋式 (Hip Thrust)</strong></td><td>3 組 × 8–10 下 (活化並強化臀大肌)</td><td><a href=\"https://www.youtube.com/results?search_query=臀推+Hip+Thrust+教學\" target=\"_blank\" style=\"color:#38BDF8; font-weight:700; text-decoration:none; background:rgba(56,189,248,0.12); padding:4px 10px; border-radius:6px; border:1px solid rgba(56,189,248,0.3); display:inline-block; font-size:0.85rem;\">▶️ 觀看教學 ↗ ↗</a></td></tr>\n<tr><td><strong>登階 (Step-up)</strong></td><td>3 組 × 6–8 下／边 (模仿跑步推蹬與單腳穩定)</td><td><a href=\"https://www.youtube.com/results?search_query=登階+Step-up+教學\" target=\"_blank\" style=\"color:#38BDF8; font-weight:700; text-decoration:none; background:rgba(56,189,248,0.12); padding:4px 10px; border-radius:6px; border:1px solid rgba(56,189,248,0.3); display:inline-block; font-size:0.85rem;\">▶️ 觀看教學 ↗ ↗</a></td></tr>\n<tr><td><strong>帕羅夫壓 (Pallof Press)</strong></td><td>2 組 × 10–12 下／邊 (核心抗旋轉能力)</td><td><a href=\"https://www.youtube.com/results?search_query=帕羅夫壓+Pallof+Press+教學\" target=\"_blank\" style=\"color:#38BDF8; font-weight:700; text-decoration:none; background:rgba(56,189,248,0.12); padding:4px 10px; border-radius:6px; border:1px solid rgba(56,189,248,0.3); display:inline-block; font-size:0.85rem;\">▶️ 觀看教學 ↗ ↗</a></td></tr>\n<tr><td><strong>怪獸走 (Monster Walk)</strong></td><td>2 組 × 10–15 步／邊 (激活臀中肌，防止膝外翻)</td><td><a href=\"https://www.youtube.com/results?search_query=怪獸走+Monster+Walk+教學\" target=\"_blank\" style=\"color:#38BDF8; font-weight:700; text-decoration:none; background:rgba(56,189,248,0.12); padding:4px 10px; border-radius:6px; border:1px solid rgba(56,189,248,0.3); display:inline-block; font-size:0.85rem;\">▶️ 觀看教學 ↗ ↗</a></td></tr>\n<tr><td><strong>離心提踵 (Eccentric Calf)</strong></td><td>3 組 × 8–12 下 (預防跟腱炎，加強推蹬剛性)</td><td><a href=\"https://www.youtube.com/results?search_query=離心提踵+Eccentric+Calf+教學\" target=\"_blank\" style=\"color:#38BDF8; font-weight:700; text-decoration:none; background:rgba(56,189,248,0.12); padding:4px 10px; border-radius:6px; border:1px solid rgba(56,189,248,0.3); display:inline-block; font-size:0.85rem;\">▶️ 觀看教學 ↗ ↗</a></td></tr>\n<tr><td><strong>髖屈肌伸展 (Hip Flexor Stretch)</strong></td><td>2 組 × 30 秒／邊 (舒緩久坐與騎車的緊繃)</td><td><a href=\"https://www.youtube.com/results?search_query=髖屈肌伸展+Hip+Flexor+Stretch+教學\" target=\"_blank\" style=\"color:#38BDF8; font-weight:700; text-decoration:none; background:rgba(56,189,248,0.12); padding:4px 10px; border-radius:6px; border:1px solid rgba(56,189,248,0.3); display:inline-block; font-size:0.85rem;\">▶️ 觀看教學 ↗ ↗</a></td></tr>\n</tbody></table>\n<hr style=\"border:none; border-top:1px solid var(--border-color); margin:20px 0;\">\n<h3 style=\"color:#38BDF8; margin-top:20px; margin-bottom:8px;\">⚡ 短課模板（週三執行，約 15–20 分鐘）</h3>\n<table class=\"table-custom\">\n<thead><tr><th>動作名稱</th><th>訓練目標與建議量</th><th>🎥 動作教學影片</th></tr></thead><tbody>\n<tr><td><strong>死蟲式 (Dead Bug)</strong></td><td>2 組 × 8–10 下／邊 (核心抗伸展能力)</td><td><a href=\"https://www.youtube.com/results?search_query=死蟲式+Dead+Bug+教學\" target=\"_blank\" style=\"color:#38BDF8; font-weight:700; text-decoration:none; background:rgba(56,189,248,0.12); padding:4px 10px; border-radius:6px; border:1px solid rgba(56,189,248,0.3); display:inline-block; font-size:0.85rem;\">▶️ 觀看教學 ↗ ↗</a></td></tr>\n<tr><td><strong>側棒式 (Side Plank)</strong></td><td>2 組 × 30 秒／邊 (強化核心抗側彎)</td><td><a href=\"https://www.youtube.com/results?search_query=側棒式+Side+Plank+教學\" target=\"_blank\" style=\"color:#38BDF8; font-weight:700; text-decoration:none; background:rgba(56,189,248,0.12); padding:4px 10px; border-radius:6px; border:1px solid rgba(56,189,248,0.3); display:inline-block; font-size:0.85rem;\">▶️ 觀看教學 ↗ ↗</a></td></tr>\n<tr><td><strong>鳥狗式 (Bird Dog)</strong></td><td>2 組 × 8 下／邊 (對側核心控制力)</td><td><a href=\"https://www.youtube.com/results?search_query=鳥狗式+Bird+Dog+教學\" target=\"_blank\" style=\"color:#38BDF8; font-weight:700; text-decoration:none; background:rgba(56,189,248,0.12); padding:4px 10px; border-radius:6px; border:1px solid rgba(56,189,248,0.3); display:inline-block; font-size:0.85rem;\">▶️ 觀看教學 ↗ ↗</a></td></tr>\n<tr><td><strong>彈力帶側走 (Band Walk)</strong></td><td>2 組 × 10–15 步／邊 (臀中肌激活)</td><td><a href=\"https://www.youtube.com/results?search_query=彈力帶側走+Band+Walk+教學\" target=\"_blank\" style=\"color:#38BDF8; font-weight:700; text-decoration:none; background:rgba(56,189,248,0.12); padding:4px 10px; border-radius:6px; border:1px solid rgba(56,189,248,0.3); display:inline-block; font-size:0.85rem;\">▶️ 觀看教學 ↗ ↗</a></td></tr>\n<tr><td><strong>單腳提踵 (Single Calf Raise)</strong></td><td>2 組 × 12–15 下／邊 (足踝推蹬剛性)</td><td><a href=\"https://www.youtube.com/results?search_query=單腳提踵+Single+Calf+Raise+教學\" target=\"_blank\" style=\"color:#38BDF8; font-weight:700; text-decoration:none; background:rgba(56,189,248,0.12); padding:4px 10px; border-radius:6px; border:1px solid rgba(56,189,248,0.3); display:inline-block; font-size:0.85rem;\">▶️ 觀看教學 ↗ ↗</a></td></tr>\n</tbody></table>\n<hr style=\"border:none; border-top:1px solid var(--border-color); margin:20px 0;\">\n<blockquote style=\"background:rgba(6,182,212,0.1); border-left:4px solid var(--accent-cyan); padding:10px 14px; margin:12px 0; border-radius:4px; font-size:0.9rem;\">⚠️ **肌力調整與安全規則：**</blockquote>\n<blockquote style=\"background:rgba(6,182,212,0.1); border-left:4px solid var(--accent-cyan); padding:10px 14px; margin:12px 0; border-radius:4px; font-size:0.9rem;\">1. 若出現關節疼痛、嚴重疲勞或睡眠不足，應果斷將主課減至 2 組或改做輕度活動度拉伸。</blockquote>\n<blockquote style=\"background:rgba(6,182,212,0.1); border-left:4px solid var(--accent-cyan); padding:10px 14px; margin:12px 0; border-radius:4px; font-size:0.9rem;\">2. 若出現尖銳疼痛，請立即停止該項訓練。</blockquote>\n<blockquote style=\"background:rgba(6,182,212,0.1); border-left:4px solid var(--accent-cyan); padding:10px 14px; margin:12px 0; border-radius:4px; font-size:0.9rem;\">3. 離心動作（如提踵）請維持 3 秒緩慢下降，勿快速摔落下彈。</blockquote>", "rev_html": "<h1 style=\"color:#F8FAFC; margin-top:28px; margin-bottom:14px; font-size:1.5rem;\">鐵人三項當週訓練執行率回顧報告 (W33)</h1>\n<p style=\"margin-bottom:10px; color:var(--text-main);\">本報告回顧了當週 (<strong>2026-08-10</strong> 至 <strong>2026-08-16</strong>) 的 TrainingPeaks 計畫執行狀況。</p>\n<p style=\"margin-bottom:10px; color:var(--text-main);\"><strong>生成時間</strong>：2026-08-16 20:00:08 | <strong>整體時間執行率</strong>：98.8%</p>\n<h2 style=\"color:#38BDF8; margin-top:24px; margin-bottom:12px; border-bottom: 1px solid var(--border-color); padding-bottom:6px;\">一、 當週數據統計</h2>\n<table class=\"table-custom\">\n<thead><tr><th>運動項目</th><th>計劃時間</th><th>實際時間</th><th>時間執行率</th><th>計劃距離</th><th>實際距離</th><th>距離執行率</th><th>總堂數</th></tr></thead><tbody>\n<tr><td>游泳 (Swim)</td><td>4.17 hr</td><td>3.65 hr</td><td>87.6%</td><td>4.20 km</td><td>10.70 km</td><td>254.8%</td><td>3</td></tr>\n<tr><td>單車 (Bike)</td><td>6.00 hr</td><td>7.83 hr</td><td>130.6%</td><td>0.00 km</td><td>188.36 km</td><td>-</td><td>2</td></tr>\n<tr><td>跑步 (Run)</td><td>5.83 hr</td><td>4.32 hr</td><td>74.0%</td><td>51.60 km</td><td>37.20 km</td><td>72.1%</td><td>4</td></tr>\n<tr><td>肌力 (Strength)</td><td>0.00 hr</td><td>0.00 hr</td><td>0.0%</td><td>-</td><td>-</td><td>-</td><td>0</td></tr>\n</tbody></table>\n<hr style=\"border:none; border-top:1px solid var(--border-color); margin:20px 0;\">\n<h2 style=\"color:#38BDF8; margin-top:24px; margin-bottom:12px; border-bottom: 1px solid var(--border-color); padding-bottom:6px;\">二、 每日課表執行明細</h2>\n<table class=\"table-custom\">\n<thead><tr><th>日期</th><th>課表名稱</th><th>類型</th><th>計劃時間</th><th>實際時間</th><th>計劃距離</th><th>實際距離</th><th>狀態</th></tr></thead><tbody>\n<tr><td>08/10 (週一)</td><td>Day Off: Base 3-2 Day Off</td><td>Day Off</td><td>0 分</td><td>0 分</td><td>-</td><td>-</td><td>休息日</td></tr>\n<tr><td>08/11 (週二)</td><td>Run: Running</td><td>Run</td><td>90 分</td><td>86 分</td><td>11.60 km</td><td>11.92 km</td><td>✅ 已完成</td></tr>\n<tr><td>08/12 (週三)</td><td>Swim: 甜甜課表</td><td>Swim</td><td>80 分</td><td>66 分</td><td>0.00 km</td><td>3.30 km</td><td>✅ 已完成</td></tr>\n<tr><td>08/13 (週四)</td><td>Bike: TEMPO 9'30 X 8 ( 或外騎 )</td><td>Bike</td><td>90 分</td><td>194 分</td><td>0.00 km</td><td>60.99 km</td><td>✅ 已完成</td></tr>\n<tr><td>08/13 (週四)</td><td>Run: 轉換20分</td><td>Run</td><td>20 分</td><td>19 分</td><td>3.00 km</td><td>3.48 km</td><td>✅ 已完成</td></tr>\n<tr><td>08/14 (週五)</td><td>Swim: 甜甜課表</td><td>Swim</td><td>80 分</td><td>68 分</td><td>0.00 km</td><td>3.30 km</td><td>✅ 已完成</td></tr>\n<tr><td>08/15 (週六)</td><td>Bike: LSD 4.5 全程 (IF 0.8-0.7</td><td>Bike</td><td>270 分</td><td>276 分</td><td>0.00 km</td><td>127.37 km</td><td>✅ 已完成</td></tr>\n<tr><td>08/15 (週六)</td><td>Run: 轉換90分</td><td>Run</td><td>90 分</td><td>30 分</td><td>14.00 km</td><td>4.28 km</td><td>✅ 已完成</td></tr>\n<tr><td>08/16 (週日)</td><td>Run: 福和橋～河濱～明德宮（補水則返）</td><td>Run</td><td>150 分</td><td>124 分</td><td>23.00 km</td><td>17.52 km</td><td>✅ 已完成</td></tr>\n<tr><td>08/16 (週日)</td><td>Swim: 4200</td><td>Swim</td><td>90 分</td><td>85 分</td><td>4.20 km</td><td>4.10 km</td><td>✅ 已完成</td></tr>\n</tbody></table>\n<hr style=\"border:none; border-top:1px solid var(--border-color); margin:20px 0;\">\n<h2 style=\"color:#38BDF8; margin-top:24px; margin-bottom:12px; border-bottom: 1px solid var(--border-color); padding-bottom:6px;\">三、 教練視角綜合解析與後續建議</h2>\n<h3 style=\"color:#38BDF8; margin-top:20px; margin-bottom:8px;\">1. 執行亮點 (Execution Highlights)</h3>\n<li style=\"margin-left:20px; margin-bottom:6px; color:var(--text-main);\"><strong>高質量耐力里程累積</strong>：當週已累積自行車 <strong>188.36 km</strong>、跑步 <strong>37.20 km</strong>、游泳 <strong>10.70 km</strong>，整體時間執行率達 <strong>98.8%</strong>。</li>\n<li style=\"margin-left:20px; margin-bottom:6px; color:var(--text-main);\"><strong>長距離單車扎實完成</strong>：順利完成 127.37 km 破百長騎課表，左右踩踏發力極為均衡（50.5% / 49.5%），座艙設定與核心肌群支撐展現高度穩定性。</li>\n<li style=\"margin-left:20px; margin-bottom:6px; color:var(--text-main);\"><strong>山道爬坡長跑與漸速巡航</strong>：8/16 順利完成 17.52 km 長跑（總爬升 +327m），平路河濱漸速至 5:26/km，上坡穩健控心率並自覺補水折返，下坡迅速拉高步頻至 180+ spm 平穩收尾。</li>\n<li style=\"margin-left:20px; margin-bottom:6px; color:var(--text-main);\"><strong>超長距離雙主課穩定巡航</strong>：8/16 游泳實游 4,100m，包含雙組 1,600m 自由式持續游，以 1:56~1:58/100m 高度一致的均速與 140 bpm 穩定心率順利吃下，展現極佳的長距離巡航水感。</li>\n<li style=\"margin-left:20px; margin-bottom:6px; color:var(--text-main);\"><strong>極佳的自我防護與疲勞決策</strong>：在長距離高負荷後無縫銜接轉換跑，並依據身體即時心率與體感自覺（Feeling 5/5）彈性調整收操時機，既達到神經肌肉轉換刺激，又有效預防過度疲勞與熱傷害。</li>\n<h3 style=\"color:#38BDF8; margin-top:20px; margin-bottom:8px;\">2. 需注意的細節與配速紀律 (Key Watchpoints & Power Pacing)</h3>\n<li style=\"margin-left:20px; margin-bottom:6px; color:var(--text-main);\"><strong>自行車長距離 (LSD) 功率控制</strong>：對標 Sub-11 藍圖 (5h30m / 140W-145W)，長距離 LSD 前段請務必克制輸出（目標區間 140W-150W），爬坡嚴守 174W (85% FTP) 上限，避免有氧解離 (Pw:HR) 過大耗損跑步雙腿剛性。</li>\n<li style=\"margin-left:20px; margin-bottom:6px; color:var(--text-main);\"><strong>下車前降瓦冷卻</strong>：下車前最後 10–15 公里主動降瓦至 123W–133W，並維持 85–90 rpm 高踏頻，讓心率下降並促進乳酸代謝。</li>\n<li style=\"margin-left:20px; margin-bottom:6px; color:var(--text-main);\"><strong>跑步步頻與著地剛性</strong>：跑步維持 175–180 spm 小步幅高步頻，觸地時間控制在 <270ms，垂直比 <9%，減輕膝蓋與下肢關節衝擊。</li>\n<li style=\"margin-left:20px; margin-bottom:6px; color:var(--text-main);\"><strong>游泳巡航手感定型</strong>：保持放鬆 Zone 1-2 低心率划水，出水前保持平穩定位 (Sighting)，目標直指 Sub-11 1:12:00 (1:53/100m) 配速線。</li>\n<h3 style=\"color:#38BDF8; margin-top:20px; margin-bottom:8px;\">3. 恢復與能量補給指南 (Recovery & Fueling Protocol)</h3>\n<li style=\"margin-left:20px; margin-bottom:6px; color:var(--text-main);\"><strong>補水與電解質</strong>：高溫與大消耗訓練後，持續每 1–2 小時補充含電解質飲品，直至尿液顏色恢復清淡。</li>\n<li style=\"margin-left:20px; margin-bottom:6px; color:var(--text-main);\"><strong>醣類與蛋白質補充</strong>：長課表後請充足補充碳水化合物與每公斤體重 1.5–2.0g 優質蛋白質，促進肌糖原快速回補與肌纖維修復。</li>\n<li style=\"margin-left:20px; margin-bottom:6px; color:var(--text-main);\"><strong>排程建議</strong>：週末雙大日累積負荷高，週一請務必以完全休息 (Rest Day) 或低心率排酸輕鬆游/滾筒伸展為主。</li>", "docx_strength": "2026-W34_第34週肌力訓練計畫.docx", "docx_articles": "2026-W34_當週鐵人新知與文章整理_中文版.docx", "docx_review": "2026-W34_當週執行率回顧報告.docx"}, "35": {"week_num": 35, "prev_week_num": 34, "monday": "2026/08/24", "sunday": "2026/08/30", "date_range": "08/24 – 08/30", "status_tag": "Future", "status_label": "預計計畫", "phase": "Base 3-4 (Recovery)", "exec_rate": 0.0, "actual_time_hrs": 0.0, "planned_time_hrs": 0.0, "swim_km": 0, "bike_km": 0, "run_km": 0, "daily_schedule": [{"date": "08/24", "day_name": "週一", "summary": "未排定", "strength": "主課 A/B (30–40 分鐘)；保留 2–3 下餘裕。"}, {"date": "08/25", "day_name": "週二", "summary": "未排定", "strength": "不排肌力；專注完成主課。"}, {"date": "08/26", "day_name": "週三", "summary": "未排定", "strength": "不排肌力；專注完成主課。"}, {"date": "08/27", "day_name": "週四", "summary": "未排定", "strength": "不排肌力；專注完成主課。"}, {"date": "08/28", "day_name": "週五", "summary": "未排定", "strength": "不排肌力；專注完成主課。"}, {"date": "08/29", "day_name": "週六", "summary": "未排定", "strength": "不排肌力；專注完成主課。"}, {"date": "08/30", "day_name": "週日", "summary": "未排定", "strength": "不排肌力；專注完成主課。"}], "estimator": {"window_date_range": "2026/07/27 – 2026/08/23 (截至上週日)", "rolling_4w_avg_run_km": 29.44, "rolling_4w_avg_bike_km": 171.82, "rolling_4w_avg_swim_km": 8.09, "rolling_4w_exec_rate": 91.1, "exec_status_text": "極佳 (有氧峰值，能量轉換順暢，執行率達標)", "marathon_shape_score": 90.5, "run_fade_penalty_mins": 3.3, "bike_fade_penalty_mins": 0.0, "swim_fad
